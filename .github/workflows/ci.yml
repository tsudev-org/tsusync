# Cổng kiểm cho mọi PR và main. Action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: read }
env:
  # Cùng ghim với qulythuchi: Dart SDK lấy từ Flutter ở đúng commit (gói `sodium` 4.x dựng libsodium qua native assets).
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_COMMIT: '737ba8f885dc774b53b442759999a312c9461e4e'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .

  worker:
    name: Máy chủ (worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Cài phụ thuộc đúng lockfile (npm ghim phiên bản)
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Kiểm lỗ hổng phụ thuộc
        run: node scripts/audit.mjs
      - name: Typecheck, lint, test (D1/R2 giả lập cục bộ, không cần token)
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
      - name: Build Worker (dry-run, không deploy)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  client-ts:
    name: Thư viện TypeScript (@tsudev/sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: clients/ts } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Cài phụ thuộc đúng lockfile (npm ghim phiên bản)
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Kiểm lỗ hổng phụ thuộc
        run: node ../../worker/scripts/audit.mjs
      - name: Typecheck, test vector + client, build
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Bản mã do TypeScript vừa tạo mở được bằng libsodium độc lập
        run: |
          set -euo pipefail
          sudo apt-get install -yq libsodium23 >/dev/null
          npm run --silent vectors > "$RUNNER_TEMP/ts.json"
          python3 -I ../../conformance/verify_libsodium.py ../../conformance/vectors-v1.json "$RUNNER_TEMP/ts.json"

  client-dart:
    name: Thư viện Dart (tsusync)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: clients/dart } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        working-directory: .
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Định dạng, phân tích, test vector + client
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed lib test tool || { dart format lib test tool >/dev/null; git diff; exit 1; }
          dart analyze --fatal-infos
          dart test
      - name: Bản mã do Dart vừa tạo mở được bằng libsodium độc lập
        run: |
          set -euo pipefail
          sudo apt-get install -yq libsodium23 >/dev/null
          dart run tool/emit_vectors.dart > "$RUNNER_TEMP/dart.json"
          python3 -I ../../conformance/verify_libsodium.py "$RUNNER_TEMP/dart.json"

  client-rust:
    name: Thư viện Rust (tsusync)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: clients/rust } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust (ghim theo rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c clippy,rustfmt
          rustc --version
      - name: Định dạng, clippy, test vector (đúng Cargo.lock)
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Bản mã do Rust vừa tạo mở được bằng libsodium độc lập
        run: |
          set -euo pipefail
          sudo apt-get install -yq libsodium23 >/dev/null
          cargo run --locked -q --example emit_vectors > "$RUNNER_TEMP/rust.json"
          python3 -I ../../conformance/verify_libsodium.py "$RUNNER_TEMP/rust.json"

  client-dotnet:
    name: Thư viện .NET (Tsudev.Sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: clients/dotnet } }
    env: { DOTNET_CLI_TELEMETRY_OPTOUT: '1', DOTNET_NOLOGO: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Khôi phục đúng packages.lock.json, định dạng, test vector (.NET 8 SDK của runner, global.json)
        run: |
          set -euo pipefail
          dotnet --version
          for p in src/Tsudev.Sync test/Tsudev.Sync.Tests tool/EmitVectors; do
            dotnet restore --locked-mode "$p"
            dotnet format "$p" --no-restore --verify-no-changes
          done
          dotnet test test/Tsudev.Sync.Tests --no-restore
      - name: Bản mã do .NET vừa tạo mở được bằng libsodium độc lập
        run: |
          set -euo pipefail
          sudo apt-get install -yq libsodium23 >/dev/null
          dotnet run --no-restore --project tool/EmitVectors > "$RUNNER_TEMP/dotnet.json"
          python3 -I ../../conformance/verify_libsodium.py "$RUNNER_TEMP/dotnet.json"
